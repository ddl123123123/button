<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>钮扣索引 配色方案</title>
<style>
  :root {
    --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", Georgia, serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, "PingFang SC", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 页面本身用不带色相的中灰，免得影响对每套纸色和夜色的判断 */
  body { background: #BDBDBD; color: #161616; font: 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  header.top { padding: 28px 32px 8px; max-width: 1500px; margin: 0 auto; }
  header.top h1 { font: 600 26px/1.2 var(--serif); letter-spacing: .04em; }
  header.top p { max-width: 46em; margin-top: 6px; color: #333; }
  .jump { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .jump a { color: inherit; text-decoration: none; background: #D6D6D6; padding: 4px 12px; border-radius: 14px; font-size: 13px; }
  .jump a:hover { background: #E6E6E6; }
  .jump b { font: 600 13px var(--mono); margin-right: 6px; }

  section.scheme { max-width: 1500px; margin: 0 auto; padding: 30px 32px 10px; scroll-margin-top: 8px; }
  .head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; align-items: baseline; margin-bottom: 14px; }
  .letter { font: 600 44px/1 var(--serif); grid-row: span 2; align-self: center; width: 1.1em; }
  .head h2 { font: 600 24px/1.25 var(--serif); letter-spacing: .03em; }
  .head p { max-width: 52em; color: #2c2c2c; }
  .mocks { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .mock { position: relative; aspect-ratio: 16 / 10; overflow: hidden; container-type: inline-size; }

  /* —— 图像视图小样 —— */
  .m-nav { position: absolute; inset: 0 0 auto 0; display: flex; justify-content: space-between; padding: 3cqw 4cqw; font-size: 2cqw; }
  .m-nav strong { font: 600 2.6cqw/1 var(--serif); letter-spacing: .08em; }
  .m-nav span + span { opacity: .45; margin-left: 2.4cqw; }
  .m-nav .on { opacity: 1; border-bottom: 1px solid currentColor; padding-bottom: .4cqw; }
  .m-info { position: absolute; left: 4cqw; top: 11cqw; width: 29cqw; }
  .m-info small { font: 1.7cqw var(--mono); opacity: .55; }
  .m-info h3 { font: 600 3.7cqw/1.2 var(--serif); margin: .3cqw 0 1.6cqw; white-space: nowrap; }
  .m-info div { display: flex; justify-content: space-between; align-items: center; font-size: 1.75cqw; padding: .55cqw 0; border-top: 1px solid var(--line); }
  .m-info div span:first-child { display: flex; align-items: center; gap: 1cqw; opacity: .8; }
  .m-info i { width: 1.4cqw; height: 1.4cqw; border-radius: 50%; display: block; }
  .m-btn { position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%) perspective(900px) rotateY(-34deg) rotateX(4deg); filter: drop-shadow(1cqw 1.4cqw 1.4cqw rgba(30, 24, 14, .3)); }
  .m-btn img { width: 100%; height: 100%; display: block; }
  .m-ticks { position: absolute; left: 50%; bottom: 4.5cqw; transform: translateX(-50%); display: flex; align-items: center; gap: 1.6cqw; font: 1.7cqw var(--mono); }
  .m-ticks i { display: block; width: 20cqw; height: 1px; background: var(--line); position: relative; }
  .m-ticks i::after { content: ""; position: absolute; left: 0; top: -1px; width: 22%; height: 3px; background: currentColor; }

  /* —— 词语视图小样 —— */
  .mock svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mock svg text { font-family: var(--mono); font-weight: 500; text-anchor: middle; dominant-baseline: central; }
  .m-legend { position: absolute; right: 3.4cqw; top: 9cqw; display: flex; flex-direction: column; align-items: flex-start; gap: 1.1cqw; }
  .m-legend span { font: 500 2.1cqw/1.35 var(--mono); padding: .25cqw 1.3cqw .4cqw; border-radius: .8cqw; }
  .m-tip { position: absolute; font-size: 1.7cqw; padding: .3cqw 1.1cqw; border-radius: .6cqw; white-space: nowrap; transform: translate(-50%, -100%); }

  .swatches { display: flex; flex-wrap: wrap; gap: 6px 4px; margin-top: 12px; }
  .sw { width: 86px; }
  .sw i { display: block; height: 34px; border: 1px solid rgba(0, 0, 0, .12); }
  .sw b { display: block; font: 500 12px/1.3 var(--sans); margin-top: 4px; }
  .sw code { font: 11px var(--mono); color: #3a3a3a; }
  .gap { width: 14px; }
  .facts { margin-top: 10px; font-size: 13px; color: #2c2c2c; max-width: 70em; }
  .facts b { font-weight: 600; }
  footer { max-width: 1500px; margin: 0 auto; padding: 26px 32px 60px; color: #333; }

  @media (max-width: 820px) {
    header.top, section.scheme, footer { padding-left: 16px; padding-right: 16px; }
    .mocks { grid-template-columns: 1fr; }
    .letter { font-size: 32px; }
    .sw { width: 72px; }
  }
</style>
</head>
<body>

<header class="top">
  <h1>钮扣索引的配色方案</h1>
  <p>每套都用同样三枚钮扣（铜鹰扣、银漩涡扣、黑色二孔扣）和同一组词语做小样：左边是图像视图，右边是词语视图。
     钮扣自己的颜色不随方案变，变的是纸面、夜色、文字、连线和八类词语的颜色。看中哪一套，把字母告诉我。</p>
  <nav class="jump" id="jump" aria-label="方案"></nav>
</header>

<div id="schemes"></div>

<footer>小样只为比较颜色，尺寸和细节以网站本身为准。</footer>

<script src="data.js?v=6"></script>
<script src="buttons.js?v=6"></script>
<script src="palettes.js?v=6"></script>
<script>
(() => {
  const TYPES = window.TYPES, items = window.BUTTONS;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // 小样里的三枚钮扣用的是真实照片；INFO 是左边信息栏显示的那一枚，jet 是词语视图中间那一枚
  const IMG = { brass: 'images/copper-eagle.png', pearl: 'images/silver-swirl.png', jet: 'images/black-two-hole.png' };
  const INFO = items[2 % items.length], jet = items[1 % items.length];

  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const lin = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const lum = h => { const [r, g, b] = rgb(h).map(lin); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const rgba = (h, a) => `rgba(${rgb(h).join(',')},${a})`;

  function browseMock(p) {
    const rows = ['material', 'color', 'form', 'craft'].map(k => {
      const t = TYPES.find(x => x.key === k);
      return `<div><span><i style="background:${p.categories[k]};border:1px solid ${rgba(p.ink, .3)}"></i>${t.label}</span><span>${esc(INFO.attrs[k])}</span></div>`;
    }).join('');
    return `<div class="mock" style="background:${p.paper};color:${p.ink};--line:${rgba(p.ink, .17)}">
      <div class="m-nav"><strong>钮扣索引</strong><div><span class="on">图像</span><span>词语</span></div></div>
      <div class="m-info"><small>No. ${INFO.no}</small><h3>${esc(INFO.name)}</h3>${rows}</div>
      <div class="m-btn" style="left:40%;top:70%;width:15%"><img src="${IMG.brass}" alt=""></div>
      <div class="m-btn" style="left:57%;top:66%;width:21%"><img src="${IMG.pearl}" alt=""></div>
      <div class="m-btn" style="left:82%;top:46%;width:31%"><img src="${IMG.jet}" alt=""></div>
      <div class="m-ticks"><span>007</span><i></i><span>044</span></div>
    </div>`;
  }

  function graphMock(p) {
    const cx = 250, cy = 205, R = 118;
    const order = ['material', 'craft', 'origin', 'use', 'motif', 'color', 'era', 'form'];
    const nodes = order.map((k, i) => {
      const a = -Math.PI / 2 + i / order.length * Math.PI * 2 + 0.2;
      const r = k === 'form' || k === 'use' ? 31 : 27;
      return { k, label: String(jet.attrs[k]), x: cx + Math.cos(a) * R * 1.08, y: cy + Math.sin(a) * R, r };
    });
    const ghosts = [[60, 70, 20], [95, 330, 24], [455, 330, 22], [470, 60, 19], [40, 200, 17], [300, 372, 18]];
    const ghostCat = ['era', 'material', 'motif', 'origin', 'craft', 'color'];
    const hot = nodes[2];   // 这一条画成悬停时的强调色
    const line = (a, b, c, o, w) => `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${c}" stroke-opacity="${o}" stroke-width="${w}"/>`;
    const F = { x: cx, y: cy };
    return `<div class="mock" style="background:${p.night};color:${p.nightInk}">
      <svg viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice">
        ${ghosts.map((g, i) => line({ x: g[0], y: g[1] }, nodes[(i * 3) % 8], p.nightInk, .16, 1)).join('')}
        ${nodes.map(n => n === hot ? line(F, n, p.accent, .95, 1.6) : line(F, n, p.nightInk, .9, 1.3)).join('')}
        ${ghosts.map((g, i) => `<circle cx="${g[0]}" cy="${g[1]}" r="${g[2]}" fill="${p.categories[ghostCat[i]]}" opacity=".38"/>`).join('')}
        <image href="${IMG.pearl}" x="508" y="286" width="34" height="34" opacity=".5"/>
        <image href="${IMG.brass}" x="136" y="40" width="30" height="30" opacity=".5"/>
        <circle cx="${cx}" cy="${cy}" r="47" fill="none" stroke="${p.nightInk}" stroke-opacity=".9"/>
        <image href="${IMG.jet}" x="${cx - 42}" y="${cy - 42}" width="84" height="84"/>
        ${nodes.map(n => `<circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${p.categories[n.k]}"/>
          <text x="${n.x}" y="${n.y}" fill="${p.nodeInk}" font-size="${n.label.length > 3 ? 11.5 : 13.5}">${esc(n.label)}</text>`).join('')}
      </svg>
      <div class="m-nav"><strong>钮扣索引</strong><div><span>图像</span><span class="on">词语</span></div></div>
      <div class="m-tip" style="left:${(hot.x / 640 * 100).toFixed(1)}%;top:${((hot.y - hot.r - 5) / 400 * 100).toFixed(1)}%;background:${p.nightInk};color:${p.night}">产地：${esc(hot.label)}，4 枚钮扣</div>
      <div class="m-legend">${TYPES.map(t => `<span style="background:${p.categories[t.key]};color:${p.nodeInk}">${t.label}</span>`).join('')}</div>
    </div>`;
  }

  const sw = (label, hex) => `<div class="sw"><i style="background:${hex}"></i><b>${label}</b><code>${hex.toUpperCase()}</code></div>`;

  const letters = 'ABCDEFGH';
  const host = document.getElementById('schemes'), jump = document.getElementById('jump');
  window.PALETTES.forEach((p, i) => {
    const L = letters[i];
    const minNode = Math.min(...TYPES.map(t => contrast(p.nodeInk, p.categories[t.key])));
    const sec = document.createElement('section');
    sec.className = 'scheme'; sec.id = 'scheme-' + L;
    sec.innerHTML = `
      <div class="head"><div class="letter">${L}</div><h2>${esc(p.name)}</h2><p>${esc(p.idea)}</p></div>
      <div class="mocks">${browseMock(p)}${graphMock(p)}</div>
      <div class="swatches">
        ${sw('纸面', p.paper)}${sw('文字', p.ink)}<div class="gap"></div>
        ${sw('夜色', p.night)}${sw('夜色上的字', p.nightInk)}${sw('强调', p.accent)}<div class="gap"></div>
        ${TYPES.map(t => sw(t.label, p.categories[t.key])).join('')}
      </div>
      <p class="facts">${p.notes ? esc(p.notes) + ' ' : ''}<b>对比度</b>：纸面上的文字 ${contrast(p.ink, p.paper).toFixed(1)}:1，夜色上的文字 ${contrast(p.nightInk, p.night).toFixed(1)}:1，圆点里的字最低 ${minNode.toFixed(1)}:1。</p>`;
    host.append(sec);
    jump.insertAdjacentHTML('beforeend', `<a href="#scheme-${L}"><b>${L}</b>${esc(p.name)}</a>`);
  });
})();
</script>
</body>
</html>
